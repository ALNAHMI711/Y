# One-command deployment on any VPS with Docker: HTTPS is automatic (Caddy + Let's Encrypt).
#   cp .env.example .env   # fill it in, set DOMAIN to a domain pointing at this server
#   docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: "3000"
    volumes:
      - tw-data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
volumes:
  tw-data:
  caddy-data:
